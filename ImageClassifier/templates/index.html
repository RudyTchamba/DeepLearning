<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy-Sad Image Classifier</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .upload-area {
            border: 2px dashed #cbd5e0;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #4299e1;
        }
        .prediction-box {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
                Happy-Sad Image Classifier
            </h1>
            
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <div id="upload-area" class="upload-area rounded-lg p-8 text-center cursor-pointer">
                    <div class="flex flex-col items-center">
                        <svg class="w-12 h-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <p class="text-gray-600 mb-2">Drop your image here or click to upload</p>
                        <p class="text-sm text-gray-500">Supported formats: JPG, PNG, JPEG</p>
                    </div>
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                </div>
            </div>

            <div id="preview-container" class="hidden bg-white rounded-lg shadow-lg p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">Preview</h2>
                <img id="preview-image" class="max-w-full h-auto rounded-lg mx-auto mb-4">
            </div>

            <div id="result-container" class="hidden bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Prediction Result</h2>
                <div id="prediction-box" class="prediction-box p-4 rounded-lg text-center">
                    <p id="prediction-label" class="text-2xl font-bold mb-2"></p>
                    <p id="prediction-confidence" class="text-gray-600"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const previewImage = document.getElementById('preview-image');
        const resultContainer = document.getElementById('result-container');
        const predictionLabel = document.getElementById('prediction-label');
        const predictionConfidence = document.getElementById('prediction-confidence');
        const predictionBox = document.getElementById('prediction-box');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-blue-500');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-blue-500');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-blue-500');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file');
                return;
            }

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);

            // Upload and get prediction
            const formData = new FormData();
            formData.append('file', file);

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                resultContainer.classList.remove('hidden');
                predictionLabel.textContent = data.label.toUpperCase();
                predictionConfidence.textContent = `Confidence: ${(data.confidence * 100).toFixed(2)}%`;
                
                // Update colors based on prediction
                if (data.label === 'happy') {
                    predictionBox.className = 'prediction-box p-4 rounded-lg text-center bg-green-100';
                    predictionLabel.className = 'text-2xl font-bold mb-2 text-green-700';
                } else {
                    predictionBox.className = 'prediction-box p-4 rounded-lg text-center bg-blue-100';
                    predictionLabel.className = 'text-2xl font-bold mb-2 text-blue-700';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error processing image');
            });
        }
    </script>
</body>
</html>
